[project]
name = "decision-benchmark-screening"
version = "0.1.0"
description = "Screen decision-making benchmarks for real difficulty before building them"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "cases/active_perception"]
